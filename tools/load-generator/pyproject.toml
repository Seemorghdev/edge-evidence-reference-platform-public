[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-evidence-load-generator"
version = "0.2.0"
description = "Bounded synthetic HTTP load generator for the Evidence API."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = ["edge-evidence-shared-contracts==0.2.0"]

[project.scripts]
synthetic-load = "edge_evidence_load_generator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
