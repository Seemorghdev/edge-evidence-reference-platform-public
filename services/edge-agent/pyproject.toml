[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-evidence-edge-agent"
version = "0.2.0"
description = "Bounded read-only synthetic artifact inspection service."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "edge-evidence-shared-contracts==0.2.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
adk = ["google-adk>=2.0.0a0"]

[project.scripts]
edge-agent = "edge_evidence_edge_agent.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
