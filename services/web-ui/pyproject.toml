[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-evidence-web-ui"
version = "0.2.0"
description = "Server-rendered synthetic artifact journey UI."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "uvicorn>=0.30,<1",
]

[project.scripts]
web-ui = "edge_evidence_web_ui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edge_evidence_web_ui = ["static/*.css", "templates/*.html"]
