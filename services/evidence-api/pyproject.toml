[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-evidence-evidence-api"
version = "0.2.0"
description = "Read-oriented synthetic evidence projection service."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "edge-evidence-shared-contracts==0.2.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
evidence-api = "edge_evidence_evidence_api.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
