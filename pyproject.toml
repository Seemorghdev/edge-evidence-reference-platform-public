[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-evidence-reference-platform-dev"
version = "0.2.0"
description = "Development tooling for the multi-service edge-evidence reference platform."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{name = "Seemorghdev"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
  "uvicorn>=0.30,<1",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
